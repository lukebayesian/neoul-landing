<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>너울 | 사장님용 손님 설문 결과</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c141c">
  <link rel="icon" href="../logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css?v=8">
  <link rel="stylesheet" href="customer.css?v=3">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../logo.svg" alt="너울 로고" width="48" height="48">
      <span>손님 설문 결과</span>
    </div>
    <span class="badge">사장님용</span>
  </header>

  <main>
    <form class="q" id="key-form">
      <label class="q-title" for="key">사장님 암호</label>
      <input id="key" name="key" type="password" autocomplete="current-password">
      <p class="error" id="key-error" role="alert"></p>
      <button type="submit" class="cta" id="load">결과 보기</button>
      <button type="button" class="ghost demo" id="demo">예시 데이터로 화면 미리보기</button>
      <p class="note">합계만 보여 줍니다. 손님 개인의 답변, 직접 쓴 글, 개인정보는 이 화면에 나오지 않습니다.</p>
    </form>

    <div id="dashboard" aria-live="polite"></div>
  </main>

  <footer></footer>

  <script src="config.js?v=1"></script>
  <script src="owner.js?v=2"></script>
</body>
</html>
